name: Release

# Builds signed installers for every platform when a version tag is pushed, then publishes
# checksums, an SBOM, and build provenance attestations to a draft GitHub release.
# See docs/release.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    # Signing secrets live in a protected environment that requires maintainer approval.
    environment: release
    permissions:
      contents: write # create the draft release and upload installers
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - name: macos-x64
            os: macos-15
            target: x86_64-apple-darwin
          # Built on the oldest supported Ubuntu so the AppImage runs on older glibc versions.
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No build caches in release builds, to rule out cache poisoning.
      - uses: ./.github/actions/setup
        with:
          rust-cache: 'false'
          build-frontend: 'false'

      - name: Add Rust target
        # bash on every runner: PowerShell (the Windows default) would read $TARGET as its own
        # variable, which is empty.
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      # The playback-only FFmpeg that converts Dolby and DTS audio (docs/adr/0007), built from
      # the checksummed source and bundled through tauri.sidecar.conf.json.
      - name: Build the FFmpeg sidecar
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            # The runner image's MinGW. FFmpeg's configure needs a POSIX temporary directory,
            # and GCC a Windows one.
            export PATH="/c/mingw64/bin:$PATH" MAKE=mingw32-make
            TMPDIR=$(cygpath -u "$RUNNER_TEMP") TMP=$(cygpath -m "$RUNNER_TEMP") TEMP=$(cygpath -m "$RUNNER_TEMP")
            export TMPDIR TMP TEMP
          fi
          bash scripts/build-ffmpeg.sh "$TARGET" src-tauri/binaries

      # Windows signing, either through Microsoft's Artifact Signing (a cloud certificate; see
      # docs/release.md) or with an exportable certificate. Both write tauri.signing.conf.json,
      # which Tauri uses to sign the app, the FFmpeg sidecar, and the installers.
      - name: Configure Artifact Signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          if (-not $env:AZURE_CLIENT_ID) { exit 0 }
          if ($env:WINDOWS_CERTIFICATE) {
            Write-Output "::error::Both AZURE_CLIENT_ID and WINDOWS_CERTIFICATE are set; keep one signing method."
            exit 1
          }
          if (-not ($env:SIGNING_ENDPOINT -and $env:SIGNING_ACCOUNT -and $env:SIGNING_PROFILE)) {
            Write-Output "::error::Set the ARTIFACT_SIGNING_ENDPOINT, ARTIFACT_SIGNING_ACCOUNT, and ARTIFACT_SIGNING_PROFILE variables."
            exit 1
          }
          # Microsoft's signing client for signtool, pinned by version and checksum.
          $version = "1.0.128"
          $sha256 = "74BD7D27E6CE1051409C38D9B46BC8DF0400ECD643D51FFBF2AC00869061E40B"
          $dir = Join-Path $env:RUNNER_TEMP "artifact-signing"
          $package = Join-Path $env:RUNNER_TEMP "artifact-signing.zip"
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/$version/microsoft.artifactsigning.client.$version.nupkg" -OutFile $package
          if ((Get-FileHash -Algorithm SHA256 $package).Hash -ne $sha256) {
            Write-Output "::error::The Artifact Signing client does not match its pinned checksum."
            exit 1
          }
          Expand-Archive -Path $package -DestinationPath $dir
          $dlib = Join-Path $dir "bin/x64/Azure.CodeSigning.Dlib.dll"
          $signer = Get-AuthenticodeSignature -LiteralPath $dlib
          if ($signer.Status -ne "Valid" -or $signer.SignerCertificate.Subject -notmatch "O=Microsoft Corporation") {
            Write-Output "::error::The Artifact Signing client is not signed by Microsoft."
            exit 1
          }
          $metadata = Join-Path $dir "metadata.json"
          @{
            Endpoint = $env:SIGNING_ENDPOINT
            CodeSigningAccountName = $env:SIGNING_ACCOUNT
            CertificateProfileName = $env:SIGNING_PROFILE
          } | ConvertTo-Json | Set-Content -Path $metadata
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $signtool) {
            Write-Output "::error::signtool.exe (Windows SDK) was not found."
            exit 1
          }
          $config = @{ bundle = @{ windows = @{ signCommand = @{
            cmd = $signtool.FullName
            args = @("sign", "/v", "/fd", "SHA256", "/tr", "http://timestamp.acs.microsoft.com",
              "/td", "SHA256", "/dlib", $dlib, "/dmdf", $metadata, "%1")
          } } } } | ConvertTo-Json -Depth 6
          Set-Content -Path src-tauri/tauri.signing.conf.json -Value $config
          Add-Content -Path $env:GITHUB_ENV -Value "SIGNING=signed"

      - name: Import Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if ($env:AZURE_CLIENT_ID) { exit 0 }
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Output "::warning::No Windows signing is configured; the Windows build will be unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "certificate.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $config = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Depth 5
          Set-Content -Path src-tauri/tauri.signing.conf.json -Value $config
          Add-Content -Path $env:GITHUB_ENV -Value "SIGNING=signed"

      # Tauri treats a defined-but-empty APPLE_CERTIFICATE as a signing request, so the
      # variables are exported only when the secrets exist. Without them the app is signed ad
      # hoc (identity "-"): Apple silicon refuses to open an app with no signature at all,
      # calling it damaged, while an ad hoc signed one only asks the user to confirm.
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          names=(APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID)
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::APPLE_CERTIFICATE is not set; the macOS build will be signed ad hoc and not notarized."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          # Signing without notarization would still be blocked by Gatekeeper.
          for name in "${names[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set; macOS signing needs all of ${names[*]}."
              exit 1
            fi
          done
          for name in "${names[@]}"; do
            delimiter="EOF_$(openssl rand -hex 16)"
            printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "${!name}" "$delimiter" >> "$GITHUB_ENV"
          done
          echo "SIGNING=signed" >> "$GITHUB_ENV"

      - name: Build and upload installers
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read by the Artifact Signing client that signtool loads (when configured).
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: TorrentStream ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what changed. Verify downloads as described in docs/release.md.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: >-
            --target ${{ matrix.target }}
            --config src-tauri/tauri.sidecar.conf.json
            ${{ runner.os == 'Windows' && hashFiles('src-tauri/tauri.signing.conf.json') != '' && '--config src-tauri/tauri.signing.conf.json' || '' }}

      # Fails the release if signing was configured but a file is not signed, and lists every
      # signature in the job summary.
      - name: Check signatures
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/check-signatures.sh "$TARGET" "${SIGNING:-unsigned}"

      # TODO(phase 5): bundle an LGPL build of libmpv for each platform
      # (see docs/adr/0001-project-license.md).

      - name: Collect installers
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          mkdir -p release-assets
          node -e 'for (const p of JSON.parse(process.env.ARTIFACT_PATHS)) console.log(p)' |
            while IFS= read -r path; do
              # .app bundles are directories; their archives (.app.tar.gz) are uploaded instead.
              if [ -f "$path" ]; then cp "$path" release-assets/; fi
            done
          ls -l release-assets

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.name }}
          path: release-assets/
          if-no-files-found: error

  provenance:
    name: Checksums, SBOM, and provenance
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # upload checksums and SBOM to the release
      id-token: write # sign attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-cyclonedx

      - name: Generate SBOM
        run: |
          cargo cyclonedx --manifest-path src-tauri/Cargo.toml --format json --spec-version 1.5 \
            --override-filename torrentstream
          # cargo-cyclonedx versions differ in the extension they add (.json or .cdx.json).
          sbom=$(find src-tauri -maxdepth 1 -name 'torrentstream*.json' | head -n 1)
          if [ -z "$sbom" ]; then
            echo "::error::cargo cyclonedx wrote no torrentstream*.json in src-tauri"
            ls -la src-tauri
            exit 1
          fi
          cp "$sbom" release-assets/torrentstream.cdx.json

      # The FFmpeg sidecar is LGPL: its exact source is published with every release.
      - name: Add the FFmpeg source
        run: bash scripts/build-ffmpeg.sh source release-assets

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Upload checksums and SBOM to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" release-assets/SHA256SUMS.txt release-assets/torrentstream.cdx.json             release-assets/ffmpeg-*.tar.xz --clobber
